# ISO 20022 Schema Policy Matrix
#
# Versions are NEVER hand-typed. They are extracted from the targetNamespace of the
# downloaded XSD at vendor time (T031) and pinned with a checksum. See docs/design/iso20022-messaging.md §3.5-3.6.

conformance:
  claim: ISO_20022_BASE            # what we may honestly assert
  notClaimed: SARB_PEM_CONFORMANT  # what we may not

contexts:
  base:
    source: PUBLIC_BASE_CATALOGUE  # iso20022.org
    retrievedOn: null              # filled at download
    messages:
      pain.001.001: { authorizedVersion: null, sha256: null }
      pacs.008.001: { authorizedVersion: null, sha256: null }
      camt.053.001: { authorizedVersion: null, sha256: null }
      head.001.001: { authorizedVersion: null, sha256: null }

  # Populated only if a MyStandards export is ever obtained. Their presence is what
  # flips the conformance claim above; nothing else may.
  samos:
    source: SARB_MYSTANDARDS
    messages: {}

  sadc_rtgs:
    source: SARB_MYSTANDARDS
    messages: {}
