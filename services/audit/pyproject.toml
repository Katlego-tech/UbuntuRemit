# Append-only audit logging and Kafka consumer service.
#
# Bounded context: Audit and compliance history (SARB PEM compliance).
# Depends on `libs/domain` and `services/asco`.

[project]
name = "ubunturemit-audit"
version = "0.0.0"
description = "Append-only audit store and Kafka consumer for ASCO audit trail."
requires-python = "==3.13.*"
dependencies = [
    "ubunturemit-domain",
    "ubunturemit-asco",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ubunturemit_audit"]
