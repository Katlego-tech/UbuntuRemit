# Rail adapters and routing service (Ripple, SWIFT, PAPSS).
#
# Bounded context: Payment rails and settlement execution.
# Depends on `libs/domain`, `services/messaging`, and `services/asco`.

[project]
name = "ubunturemit-rails"
version = "0.0.0"
description = "Settlement rail adapters (Ripple, PAPSS, SWIFT) and retry router."
requires-python = "==3.13.*"
dependencies = [
    "ubunturemit-domain",
    "ubunturemit-messaging",
    "ubunturemit-asco",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ubunturemit_rails"]
